name: Build & Deploy

# Publish separate main and dev images. Only main updates :latest.
# Deployment is handled externally; see docs/setup.md for health checks and rollback.
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  test:
    runs-on: docker
    container:
      image: ghcr.io/astral-sh/uv:python3.12-bookworm
    steps:
      # The uv image has no node, so the JS-based actions/checkout can't run —
      # check out the pushed ref through git using the job token.
      - name: Checkout
        run: |
          git init -q .
          git config --global --add safe.directory "$PWD"
          origin=$(echo "${{ github.server_url }}/${{ github.repository }}.git" \
            | sed "s|://|://x-access-token:${{ github.token }}@|")
          git remote add origin "$origin"
          git fetch -q --depth 1 origin "+${{ github.ref }}:refs/ci"
          git checkout -q refs/ci

      - name: Run tests
        run: |
          uv sync --frozen --extra soulseek
          uv run --no-sync pytest -q

  build:
    runs-on: docker
    container:
      image: node:22-bookworm
    needs: test
    env:
      REGISTRY: ${{ secrets.REGISTRY }}
      IMAGE: ${{ secrets.REGISTRY }}/${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install docker CLI
        run: |
          curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-27.5.1.tgz \
            | tar xz --strip-components=1 -C /usr/local/bin docker/docker
          docker version --format '{{.Client.Version}}'

      - name: Login to registry
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login "$REGISTRY" -u egor --password-stdin

      - name: Build & push
        run: |
          branch_tag=$([ "${{ github.ref_name }}" = "main" ] && echo latest || echo dev)
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:$branch_tag" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:$branch_tag"
          docker build --build-arg MUSICBOT_EXTRAS=soulseek \
            -t "$IMAGE:${{ github.sha }}-soulseek" -t "$IMAGE:$branch_tag-soulseek" .
          docker push "$IMAGE:${{ github.sha }}-soulseek"
          docker push "$IMAGE:$branch_tag-soulseek"

      # Keep the current build as layer cache and remove superseded local tags.
      # Published images remain available in the registry.
      - name: Drop superseded local images
        if: always()
        run: |
          docker images --filter "reference=$IMAGE:*" --format '{{.Repository}}:{{.Tag}}' \
            | grep -v "${{ github.sha }}" \
            | xargs -r docker rmi || true
          docker image prune -f

# There is no deploy job here on purpose: the machine that runs this service
# watches the branch and the registry itself and updates when they move. CI
# publishes an image and holds no way in.
