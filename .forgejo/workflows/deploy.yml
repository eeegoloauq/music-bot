name: Build & Deploy

# main and dev both deploy to the same VM — dev to test on the live bot,
# merge dev → main to promote (docs/local-upload-plan.md). Only main may
# stamp :latest; dev builds get :dev so a test push can't hijack the tag
# main deploys from.
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  test:
    runs-on: docker
    container:
      image: ghcr.io/astral-sh/uv:python3.12-bookworm
    steps:
      # The uv image has no node, so the JS-based actions/checkout can't run —
      # plain shell checkout of the pushed ref using the job token (same
      # pattern as aether's go-check job).
      - name: Checkout
        run: |
          git init -q .
          git config --global --add safe.directory "$PWD"
          origin=$(echo "${{ github.server_url }}/${{ github.repository }}.git" \
            | sed "s|://|://x-access-token:${{ github.token }}@|")
          git remote add origin "$origin"
          git fetch -q --depth 1 origin "+${{ github.ref }}:refs/ci"
          git checkout -q refs/ci

      - name: Run tests
        run: |
          uv sync --frozen
          uv run --no-sync pytest -q

  build:
    runs-on: docker
    container:
      image: node:22-bookworm
    needs: test
    env:
      REGISTRY: ${{ secrets.REGISTRY }}
      IMAGE: ${{ secrets.REGISTRY }}/homelab/music-bot
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install docker CLI
        run: |
          curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-27.5.1.tgz \
            | tar xz --strip-components=1 -C /usr/local/bin docker/docker
          docker version --format '{{.Client.Version}}'

      - name: Login to registry
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login "$REGISTRY" -u egor --password-stdin

      - name: Build & push
        run: |
          branch_tag=$([ "${{ github.ref_name }}" = "main" ] && echo latest || echo dev)
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:$branch_tag" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:$branch_tag"

      # The runner disk is 10G and every push leaves ~320MB of SHA-tagged
      # images behind; without cleanup they pile up until docker build dies
      # with ENOSPC (bit the lala repo 2026-07-05). Keep only the just-built
      # image — it doubles as layer cache for the next build; older tags
      # live in the registry anyway.
      - name: Drop superseded local images
        if: always()
        run: |
          docker images --format '{{.Repository}}:{{.Tag}}' \
            | { grep -E "^$REGISTRY/homelab/music-bot:" || true; } \
            | grep -v "${{ github.sha }}" \
            | xargs -r docker rmi || true
          docker image prune -f

# There is no deploy job here on purpose: the machine that runs this service
# watches the branch and the registry itself and updates when they move. CI
# publishes an image and holds no way in.
