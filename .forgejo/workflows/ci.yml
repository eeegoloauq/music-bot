# Runs in Forgejo, where the pull requests are — .github/workflows/tests.yml is
# the same suite on GitHub, and Forgejo ignores that directory in a repository
# that has .forgejo/workflows/. uv is installed from upstream rather than
# through astral-sh/setup-uv, which this instance does not mirror.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the running check pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      # Pinned: the unversioned installer would run whatever astral.sh serves
      # that morning, which is a script this CI executes as itself.
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/0.12.6/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run pytest
        run: |
          uv sync --frozen
          uv run --no-sync pytest -q
