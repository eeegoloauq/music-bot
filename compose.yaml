services:
  music-bot:
    image: ${MUSICBOT_IMAGE:-ghcr.io/eeegoloauq/music-bot}:${MUSICBOT_TAG:-latest}
    container_name: music-bot
    user: "${MUSICBOT_UID:-1000}:${MUSICBOT_GID:-1000}"
    restart: unless-stopped
    env_file: .env
    environment:
      # Library path inside this container; MUSIC_LIBRARY_DIR is the host path.
      MUSIC_DIR: /music
    volumes:
      - ${MUSIC_LIBRARY_DIR:-/media/music}:/music
      # Crash ledger for in-flight downloads (journal.py) — must outlive
      # container recreates. Pre-create it owned by the deploy user
      # (`install -d -o $MUSICBOT_UID -g $MUSICBOT_GID bot-data`) — docker
      # would otherwise auto-create it root-owned on first up. Files inside land
      # 0664 from the umask, so a host account in the group can manage them.
      - ./bot-data:/data
    # Local-upload web page (optional): set UPLOAD_HTTP_PORT in .env and
    # uncomment. 0.0.0.0 exposes it to your LAN — the page has no auth, so
    # never publish it wider without a reverse proxy in front.
    #ports:
    #  - 0.0.0.0:${UPLOAD_HTTP_PORT:-8080}:${UPLOAD_HTTP_PORT:-8080}
    # Give a nearly-finished track a chance to import + tag before SIGKILL;
    # anything longer is the resume journal's job.
    stop_grace_period: 30s
    extra_hosts:
      - host.docker.internal:host-gateway
networks: {}
